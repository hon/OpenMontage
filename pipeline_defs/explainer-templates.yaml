name: explainer-templates
version: "1.0"
description: >
  解说类视频管线，支持多种视觉模板。用户提供文案 → AI 格式化为视频脚本方案 → 用户确认 →
  按所选模板生成 scene_plan → assets → edit → compose → publish。
  模板定义场景类型、布局骨架、动效方式；风格板（playbook）独立控制颜色/字体/视觉语言。

category: generated
stability: experimental

default_checkpoint_policy: guided

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/explainer-templates/executive-producer
  - pipelines/explainer-templates/script-director
  - pipelines/explainer-templates/scene-director
  - pipelines/explainer-templates/asset-director
  - pipelines/explainer-templates/edit-director
  - pipelines/explainer-templates/compose-director
  - pipelines/explainer-templates/publish-director
  - meta/reviewer
  - meta/checkpoint-protocol

orchestration:
  mode: executive-producer
  skill: pipelines/explainer-templates/executive-producer
  budget_default_usd: 0.00
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 20

compatible_playbooks:
  recommended:
    - clean-professional
  custom_allowed: true

# ── Template Registry ─────────────────────────────────────────────
# Each template defines:
#   scene_types.allowed   — what scene types scene-director may generate
#   composition           — viewport, runtime (hyperframes / remotion)
#   motion                — animation type and parameters
#   assets                — image source, narration provider
#   files                 — skeleton HTML + CSS to load
#
# Add new templates by creating a directory under templates/<name>/
# and registering it here.

templates:
  minimal:
    description: "GSAP 驱动竖屏解说模板 — 独立背景层 (Ken Burns 交替缩放入/出) + 居中文字滑入/淡出 + 关键词高亮 + BGM ducking。对齐 trading-psychology 旧项目动效质量。"
    version: "2.0"
    file: templates/minimal/template.yaml

stages:
  # ── Pre-production ─────────────────────────────────────────────

  - name: script
    skill: pipelines/explainer-templates/script-director
    required_artifacts_in: []
    optional_artifacts_in: []
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - All user-provided copy is preserved verbatim (no AI rewrites)
      - Section boundaries follow natural narrative breaks
      - Timing is proportional to section text length (~2.5-3 chars/sec for Chinese)
      - Visual concepts fit the selected template's scene types
      - Visual mood shifts match copy tone changes
    success_criteria:
      - User confirmed script table (confirmation_status: "confirmed")
      - All sections have label, text, timing, and visual_concept
      - Total duration covers full copy without omission

  # ── Production ──────────────────────────────────────────────────

  - name: scene_plan
    skill: pipelines/explainer-templates/scene-director
    required_artifacts_in:
      - script
    optional_artifacts_in: []
    produces:
      - scene_plan
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Full script duration covered with no gaps
      - Only scene types allowed by the selected template are used
      - Each scene has a mood-appropriate background (image or video)
      - Asset search queries are concrete and match the visual mood
    success_criteria:
      - Schema-valid scene_plan with required_assets per scene
      - All scene types are in template's allowed list

  - name: assets
    skill: pipelines/explainer-templates/asset-director
    required_artifacts_in:
      - scene_plan
      - script
    optional_artifacts_in: []
    produces:
      - asset_manifest
    required_tools:
      - tts_selector
      - image_selector
    optional_tools:
      - video_selector
      - music_gen
    tools_available:
      - tts_selector
      - image_selector
      - video_selector
      - music_gen
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - All asset files exist on disk
      - Narration covers all script sections
      - Images sourced from stock photo APIs (zero cost) unless template specifies otherwise
      - Total cost within budget (default $0)
    success_criteria:
      - Schema-valid asset_manifest with all required assets generated
      - All file paths resolve to existing files

  - name: edit
    skill: pipelines/explainer-templates/edit-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
    optional_artifacts_in:
      - script
    produces:
      - edit_decisions
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - All cuts reference valid assets from manifest
      - Subtitles enabled
      - No timeline gaps or overlaps
    success_criteria:
      - Schema-valid edit_decisions
      - Full video duration covered

  - name: compose
    skill: pipelines/explainer-templates/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
    optional_artifacts_in:
      - scene_plan
    produces:
      - render_report
      - final_review
    required_tools:
      - hyperframes_compose
      - audio_mixer
    tools_available:
      - hyperframes_compose
      - audio_mixer
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Output video exists and is playable
      - Duration within ±5% of target
      - Audio is clear with proper narration/music balance
      - Template skeleton structure preserved in output
      - `hyperframes lint` and `hyperframes validate` pass before render
    success_criteria:
      - Schema-valid render_report with output paths
      - Output file exists and passes ffprobe validation

  - name: publish
    skill: pipelines/explainer-templates/publish-director
    required_artifacts_in:
      - render_report
      - final_review
    optional_artifacts_in: []
    produces:
      - publish_log
    tools_available: [export_bundle]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - SEO metadata complete and keyword-rich
      - Chapter markers present
      - Export package structured correctly
    success_criteria:
      - Schema-valid publish_log
      - Export directory contains video, metadata, and thumbnail concept
