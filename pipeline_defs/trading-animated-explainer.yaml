name: trading-animated-explainer
version: "1.0"
description: >
  交易/金融教育竖屏口播视频管线。用户提供文案 → AI 格式化为视频脚本方案 → 用户确认 →
  scene_plan → assets → edit → compose → publish。固定模板：背景图片/视频 + 逐句文字淡入。
  无 AI 脚本生成，无复杂动画。
category: custom
stability: production

default_checkpoint_policy: guided

# Reference video input support
reference_input:
  supported: true
  analysis_depth: standard
  analysis_tools:
    - video_analyzer
    - transcript_fetcher
    - video_downloader
    - scene_detect
    - frame_sampler

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/trading-animated-explainer/executive-producer
  - pipelines/trading-animated-explainer/script-director
  - pipelines/trading-animated-explainer/scene-director
  - pipelines/trading-animated-explainer/asset-director
  - pipelines/trading-animated-explainer/edit-director
  - pipelines/trading-animated-explainer/compose-director
  - pipelines/trading-animated-explainer/publish-director
  - meta/reviewer
  - meta/checkpoint-protocol

orchestration:
  mode: executive-producer
  skill: pipelines/trading-animated-explainer/executive-producer
  budget_default_usd: 0.00
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 20

compatible_playbooks:
  recommended:
    - clean-professional
    - flat-motion-graphics
  also_works:
    - minimalist-diagram
  custom_allowed: true

stages:
  # ── Pre-Production ──────────────────────────────────────────────

  # User provides copy → script-director formats into table → user confirms
  # This is the entry point. No research or proposal needed.

  - name: script
    skill: pipelines/trading-animated-explainer/script-director
    required_artifacts_in: []
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - All user-provided copy is preserved verbatim (no AI rewrites)
      - Section boundaries follow natural narrative breaks
      - Timing is proportional to section text length (~2.5-3 chars/sec for Chinese)
      - Each 画面构思 fits simple template mode (natural scenery + text overlay, no animation)
      - Visual mood shifts match copy tone changes
    success_criteria:
      - User confirmed script table (confirmation_status is "confirmed")
      - All sections have label, text, timing, and visual_concept
      - Total duration covers full copy without omission
    optional_artifacts_in: [proposal_packet]

  - name: scene_plan
    skill: pipelines/trading-animated-explainer/scene-director
    required_artifacts_in:
      - script
    optional_artifacts_in:
      - proposal_packet
    produces:
      - scene_plan
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Full script duration covered with no gaps
      - Each scene has a mood-appropriate background image (or video)
      - No two consecutive scenes use the same scenery biome
      - Asset feasibility - background images source from stock photo APIs
    success_criteria:
      - Schema-valid scene_plan with required_assets per scene
      - All scenes are type background_image (or background_video)

  - name: assets
    skill: pipelines/trading-animated-explainer/asset-director
    required_artifacts_in:
      - scene_plan
      - script
    optional_artifacts_in:
      - proposal_packet
    produces:
      - asset_manifest
    required_tools:
      - tts_selector
      - image_selector
    optional_tools:
      - video_selector
      - math_animate
      - diagram_gen
      - code_snippet
      - music_gen
    tools_available:
      - tts_selector
      - image_selector
      - video_selector
      - diagram_gen
      - code_snippet
      - music_gen
      - math_animate
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - All asset files exist on disk
      - Narration covers all script sections
      - Narration assets apply the approved voice performance plan and sample settings
      - Total cost within approved budget from proposal_packet
      - Image style consistency across all generated visuals
    success_criteria:
      - Schema-valid asset_manifest with all required assets generated
      - All file paths resolve to existing files

  - name: edit
    skill: pipelines/trading-animated-explainer/edit-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
    optional_artifacts_in:
      - script
    produces:
      - edit_decisions
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - All cuts reference valid assets from manifest
      - Subtitles enabled with playbook-compatible styling
      - Music configured with ducking parameters
      - No timeline gaps or overlaps
    success_criteria:
      - Schema-valid edit_decisions
      - Full video duration covered

  - name: compose
    skill: pipelines/trading-animated-explainer/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
    optional_artifacts_in:
      - scene_plan
    produces:
      - render_report
      - final_review
    required_tools:
      - video_compose
      - audio_mixer
    optional_tools:
      - video_stitch
    tools_available:
      - video_compose
      - hyperframes_compose
      - video_stitch
      - audio_mixer
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Output video exists and is playable
      - "Duration within +/-5% of target"
      - Audio is clear with proper narration/music balance
      - "`hyperframes lint` and `hyperframes validate` must pass before render"
    success_criteria:
      - Schema-valid render_report with output paths
      - Output file exists and passes ffprobe validation

  - name: publish
    skill: pipelines/trading-animated-explainer/publish-director
    required_artifacts_in:
      - render_report
      - final_review
    optional_artifacts_in:
      - proposal_packet
    produces:
      - publish_log
    tools_available: [export_bundle]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - SEO metadata complete and keyword-rich
      - Chapter markers present
      - Export package structured correctly
    success_criteria:
      - Schema-valid publish_log
      - Export directory contains video, metadata, and thumbnail concept
